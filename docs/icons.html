<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图标候选</title>
<style>
body{margin:0;padding:28px 20px 60px;background:#0f1424;color:#e6ebe8;font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
h1{font-size:20px;margin:0 0 6px}
p{color:#9aa8b8;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#171f33;border:1px solid #27324d;border-radius:14px;padding:18px}
.card h2{font-size:16px;margin:0 0 4px}
.card small{display:block;color:#8a97b0;margin-bottom:14px;line-height:1.5}
.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.row svg{display:block;border-radius:22%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.row .s{border-radius:24%}
.light{background:#f2f4f8;border-radius:10px;padding:10px;display:flex;gap:12px;align-items:center}
</style></head><body>
<h1>wxq 图标候选</h1>
<p>每个方案:主屏幕尺寸 96、书签 40、标签页 20,以及浅色底上的效果。</p>

  const el = document.createElement("div"); el.className = "card";
  const svg = s => v.svg.replace("<svg ", `<svg width="${s}" height="${s}" `);
  el.innerHTML = `<h2>${v.name}</h2><small>${v.desc}</small>
    <div class="row">${svg(96)}${svg(40)}${svg(20)}<div class="light">${svg(40)}${svg(20)}</div></div>`;
  g.appendChild(el);

</script></body></html>
